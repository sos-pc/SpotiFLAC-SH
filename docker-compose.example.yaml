services:
  spotiflac:
    image: ghcr.io/sos-pc/spotiflac-sh:latest
    container_name: spotiflac
    restart: unless-stopped
    ports:
      - "6890:6890"
    environment:
      - JELLYFIN_URL=http://your-jellyfin-host:8096
      - JWT_SECRET=change-me-to-a-random-32-char-string
    # L'image tourne en non-root, uid/gid 1000. Les dossiers montés ci-dessous
    # doivent appartenir à ce même uid AVANT le premier démarrage, sinon le
    # conteneur crash au démarrage ("permission denied") :
    #   sudo chown -R 1000:1000 /path/to/music /path/to/config
    user: "1000:1000"
    volumes:
      # Dossier de téléchargement musique
      - /path/to/music:/home/nonroot/Music
      # Configuration et base de données
      - /path/to/config:/home/nonroot/.SpotiFLAC
