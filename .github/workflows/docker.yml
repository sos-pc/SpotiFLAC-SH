name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
    # One publication branch (main, released by tag) and feature branches, which
    # each publish their own image so a change can be tested before it lands.
    # `dev2` was deleted in v4.0.0: it had drifted 218 commits behind the branch
    # the work was actually happening on, which is what a dev branch that is not
    # the working branch always does.
    branches:
      - 'feature/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend (required for go:embed)
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Runs right after the frontend build with nothing in between — go
      # test needs the go:embed'd frontend/dist directory (untracked,
      # gitignored) to still be on disk, and at least one of the linting
      # actions below was observed wiping it out (fine for go vet/
      # golangci-lint/govulncheck, which don't need to actually embed file
      # contents to type-check, but not for a real go test build).
      # -race is not optional here: backend/spotify's concurrency test documents
      # that it "must be run with -race" (the detector, or a hard map-write
      # crash, is what actually proves the token-reset fix — a plain run catches
      # it only unreliably). It was absent for a long time, so the test wasn't
      # doing its job. Enabled after a throwaway race-probe branch ran the whole
      # suite with -race and found nothing across the 56 concurrent files: cost
      # is ~+53s (76s -> 129s), risk of a surprise failure was measured to be
      # zero before turning it on here.
      - name: Run Go tests
        run: go test ./... -v -race

      - name: go vet
        run: go vet ./...

      # go.mod/go.sum are only ever tidied inline during the Dockerfile
      # build (`go mod tidy` right before the binary is compiled) — nothing
      # checks the committed files themselves, so a manifest that drifted
      # (a dependency added/removed in code without re-running `go mod
      # tidy` locally) would go unnoticed until someone happens to look.
      # Re-run it here and fail if it would change anything.
      - name: Verify go.mod/go.sum are tidy
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod.orig go.mod > /dev/null || ! diff -q go.sum.orig go.sum > /dev/null; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' locally and commit the result."
            diff -u go.mod.orig go.mod || true
            diff -u go.sum.orig go.sum || true
            exit 1
          fi
          rm -f go.mod.orig go.sum.orig

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Not golang/govulncheck-action: that action has a default go-version
      # input baked in that silently wins over go-version-file ("Both
      # go-version and go-version-file inputs are specified, only go-version
      # will be used" — a known, still-open bug: golang/go#61343,
      # golang/go#70036), so it isn't guaranteed to actually run against the
      # Go version go.mod requires. Running it directly reuses the Go
      # toolchain "Set up Go" already resolved unambiguously above.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Frontend lint
        working-directory: frontend
        run: bun run lint

      # Equivalent of the go.mod tidy check above, for the frontend:
      # package.json can accumulate dependencies nobody imports anymore
      # after a refactor, with nothing to catch it. tailwindcss/
      # tw-animate-css are real, load-bearing dependencies (see
      # src/index.css's @import lines) that depcheck can't see because it
      # only looks for JS/TS import statements, not CSS @import — the only
      # two false positives found when this check was introduced.
      - name: Frontend unused dependency check
        working-directory: frontend
        run: bunx depcheck --ignores="tailwindcss,tw-animate-css"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The check whose absence let ffmpeg ship broken for three days.
      #
      # Building the image proves nothing about ffmpeg: COPY succeeds as long as
      # the file exists, and nothing in this workflow ever ran it. So the switch
      # to a `scratch` runtime shipped binaries that were present, executable,
      # and unable to start (dynamically linked, no ELF loader) — green CI, dead
      # feature, discovered only by reading production logs days later. See
      # docs/ffmpeg-runtime-regression.md.
      #
      # `-version` is enough: it exercises exec + the dynamic loader + libc
      # startup, which is the entire failure mode. Run through `docker run` on
      # the pushed image rather than a RUN layer, because the runtime image has
      # no shell — the binary is invoked directly as the entrypoint.
      - name: Smoke-test that ffmpeg/ffprobe actually run
        run: |
          set -euo pipefail
          IMAGE='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          # A shared directory, because the runtime image has no shell: each
          # `docker run` is one binary, and this is how a file survives between
          # them. A host bind mount rather than a named volume: Docker creates a
          # named volume root-owned when its mount point doesn't pre-exist in the
          # image, and this container runs as uid 1000 — which is exactly how the
          # first version of this step failed, with ffmpeg reporting "Permission
          # denied" on its output.
          SMOKE="$RUNNER_TEMP/ff-smoke"
          mkdir -p "$SMOKE" && chmod 777 "$SMOKE"
          ff()  { docker run --rm -v "$SMOKE:/scratch" --entrypoint /usr/local/bin/ffmpeg  "$IMAGE" "$@"; }
          ffp() { docker run --rm -v "$SMOKE:/scratch" --entrypoint /usr/local/bin/ffprobe "$IMAGE" "$@"; }

          # 1. exec + dynamic loader + libc startup — the whole failure mode of
          #    the scratch regression, which a successful COPY never proved.
          echo "::group::ffmpeg/ffprobe -version"
          ff  -version
          ffp -version
          echo "::endgroup::"

          # 2. The flags in backend/util/ffmpeg_hardening.go are only correct if
          #    both binaries accept them. -nostdin especially is ffmpeg-only:
          #    passed to ffprobe it would exit non-zero and silently break every
          #    tag read. Assert the real production argv on a real file instead
          #    of trusting the reasoning that chose them.
          echo "::group::hardened argv, real file"
          ff -f lavfi -i "sine=frequency=440:duration=1" -c:a flac -y /scratch/src.flac
          # exactly backend/tidal/client.go's shape
          ff -nostdin -protocol_whitelist file -y -i /scratch/src.flac -vn -c:a flac /scratch/out.flac
          # exactly backend/util/ffprobetags.go's shape
          ffp -protocol_whitelist file -v quiet -print_format json -show_format -show_streams /scratch/out.flac
          test -s "$SMOKE/out.flac" || { echo "conversion produced nothing"; exit 1; }
          echo "::endgroup::"

      # Pinned to a commit SHA, not a tag: in March 2026 aquasecurity/trivy-action
      # was compromised via a stolen credential that force-pushed 75 of its 76
      # version tags (including floating majors like v0.28) to malicious commits
      # that stole CI secrets. This SHA (tag v0.35.0's target before the attack,
      # confirmed unaffected — https://github.com/aquasecurity/trivy-action/releases/tag/v0.35.0)
      # can't be silently moved to point somewhere else the way a tag can.
      #
      # Blocking. History, and what the numbers actually meant: replacing
      # apt-installed ffmpeg with a BtbN build took a real scan from 51+9
      # CRITICAL/HIGH (debian:trixie-slim) and 6+6 (bookworm-slim) down to 0 on
      # `scratch`. That 0 was never as strong as it looked — Trivy enumerates OS
      # packages and language binaries (gobinary), so the ~115MB of codec
      # libraries BtbN bakes into the ffmpeg executable are invisible to it. The
      # risky code didn't leave; it stopped being enumerable. (The genuine win is
      # real though: BtbN tracks ffmpeg master, where Debian ships a years-old
      # branch.)
      #
      # The runtime is now distroless/cc (see the Dockerfile — `scratch` could
      # not execute those binaries at all), so glibc/libgcc CVEs are reportable
      # again and this gate may start failing on them. That is the trade being
      # made deliberately: the exploitable surface here is ffmpeg parsing
      # third-party bytes, which is identical on either base — only the report
      # changes. See docs/ffmpeg-runtime-regression.md §4.
      - name: Scan pushed image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          # Not env.IMAGE_NAME (github.repository, e.g. "sos-pc/SpotiFLAC-SH") —
          # OCI image references must be all-lowercase and that isn't, which
          # made Trivy reject it outright ("could not parse reference").
          # docker/metadata-action already lowercased it correctly for the tag
          # actually pushed; reuse that instead of re-deriving it here.
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
