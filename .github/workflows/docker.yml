name: Build & Publish Docker Image

# What each event produces:
#
#   a version tag  → :X.Y.Z, :X.Y, :latest   a release
#   a push to main → :main                   what the deployment tracks
#   a pull request → :pr-<number>            a preview to test before merging
#   manual dispatch → :<branch>              anything else, on demand
#
# `branches: [feature/**]` used to stand in for "a change worth previewing".
# It was an allowlist masquerading as a rule: any other prefix silently got no
# image, which is how #35 and #36 shipped from `fix/**` branches with nothing to
# deploy and test. A pull request is already the event that means someone is
# proposing a change — it is what gates the tests, and now what builds the
# preview. Name branches whatever you like.
#
# `main` is here because production runs `:main`, and that tag used to move only
# when someone remembered to dispatch this workflow by hand. Merging changed
# nothing on the server and said nothing about it: on 2026-08-10 the deployment
# was pulled expecting the merge of #46 and quietly kept running the image built
# from 87decbc, twelve hours older. Nothing was broken that time — #46 touched
# only an engine patch, which never enters this image — but the next Go change to
# merge would have sat unpublished the same way, with no signal anywhere.
#
# No paths-ignore on this trigger, deliberately, even though a docs-only merge
# now rebuilds 114 MB for nothing. A `paths` filter inside `push` applies to the
# tag patterns too, so cutting a release from a commit that only touched docs
# would silently publish no image at all. A few wasted minutes on a rare event
# beats a release that isn't there.
#
# `:latest` still moves on version tags only. Releasing stays a decision.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    # A docs-only PR does not need a 114 MB image built for it.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.kiro/**'
  workflow_dispatch:

# Two merges landing close together race, and the loser is whichever build
# finishes second — which may be the older commit, leaving `:main` pointing at
# code that is no longer main. Grouping per ref makes the newer push cancel the
# older build instead. Tags and pull requests each get their own group from
# github.ref, so a release build can never be cancelled by a merge.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    # The steps live in go-checks.yml so test.yml can run the identical set on
    # main and on pull requests. Publication triggers are unchanged.
    uses: ./.github/workflows/go-checks.yml

  build-and-push:
    needs: test
    # A pull request from a fork gets a read-only token, so `packages: write` is
    # not grantable and the push would fail at the last step of a five-minute
    # build. Skip it there rather than produce a red check nobody can fix: the
    # tests above still run on fork PRs, which is the part that gates merging.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=pr
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The check whose absence let ffmpeg ship broken for three days.
      #
      # Building the image proves nothing about ffmpeg: COPY succeeds as long as
      # the file exists, and nothing in this workflow ever ran it. So the switch
      # to a `scratch` runtime shipped binaries that were present, executable,
      # and unable to start (dynamically linked, no ELF loader) — green CI, dead
      # feature, discovered only by reading production logs days later. See
      # docs/ffmpeg-runtime-regression.md.
      #
      # `-version` is enough: it exercises exec + the dynamic loader + libc
      # startup, which is the entire failure mode. Run through `docker run` on
      # the pushed image rather than a RUN layer, because the runtime image has
      # no shell — the binary is invoked directly as the entrypoint.
      - name: Smoke-test that ffmpeg/ffprobe actually run
        run: |
          set -euo pipefail
          IMAGE='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          # A shared directory, because the runtime image has no shell: each
          # `docker run` is one binary, and this is how a file survives between
          # them. A host bind mount rather than a named volume: Docker creates a
          # named volume root-owned when its mount point doesn't pre-exist in the
          # image, and this container runs as uid 1000 — which is exactly how the
          # first version of this step failed, with ffmpeg reporting "Permission
          # denied" on its output.
          SMOKE="$RUNNER_TEMP/ff-smoke"
          mkdir -p "$SMOKE" && chmod 777 "$SMOKE"
          ff()  { docker run --rm -v "$SMOKE:/scratch" --entrypoint /usr/local/bin/ffmpeg  "$IMAGE" "$@"; }
          ffp() { docker run --rm -v "$SMOKE:/scratch" --entrypoint /usr/local/bin/ffprobe "$IMAGE" "$@"; }

          # 1. exec + dynamic loader + libc startup — the whole failure mode of
          #    the scratch regression, which a successful COPY never proved.
          echo "::group::ffmpeg/ffprobe -version"
          ff  -version
          ffp -version
          echo "::endgroup::"

          # 2. The flags in backend/util/ffmpeg_hardening.go are only correct if
          #    both binaries accept them. -nostdin especially is ffmpeg-only:
          #    passed to ffprobe it would exit non-zero and silently break every
          #    tag read. Assert the real production argv on a real file instead
          #    of trusting the reasoning that chose them.
          echo "::group::hardened argv, real file"
          ff -f lavfi -i "sine=frequency=440:duration=1" -c:a flac -y /scratch/src.flac
          # exactly backend/tidal/client.go's shape
          ff -nostdin -protocol_whitelist file -y -i /scratch/src.flac -vn -c:a flac /scratch/out.flac
          # exactly backend/util/ffprobetags.go's shape
          ffp -protocol_whitelist file -v quiet -print_format json -show_format -show_streams /scratch/out.flac
          test -s "$SMOKE/out.flac" || { echo "conversion produced nothing"; exit 1; }
          echo "::endgroup::"

      # Pinned to a commit SHA, not a tag: in March 2026 aquasecurity/trivy-action
      # was compromised via a stolen credential that force-pushed 75 of its 76
      # version tags (including floating majors like v0.28) to malicious commits
      # that stole CI secrets. This SHA (tag v0.35.0's target before the attack,
      # confirmed unaffected — https://github.com/aquasecurity/trivy-action/releases/tag/v0.35.0)
      # can't be silently moved to point somewhere else the way a tag can.
      #
      # Blocking. History, and what the numbers actually meant: replacing
      # apt-installed ffmpeg with a BtbN build took a real scan from 51+9
      # CRITICAL/HIGH (debian:trixie-slim) and 6+6 (bookworm-slim) down to 0 on
      # `scratch`. That 0 was never as strong as it looked — Trivy enumerates OS
      # packages and language binaries (gobinary), so the ~115MB of codec
      # libraries BtbN bakes into the ffmpeg executable are invisible to it. The
      # risky code didn't leave; it stopped being enumerable. (The genuine win is
      # real though: BtbN tracks ffmpeg master, where Debian ships a years-old
      # branch.)
      #
      # The runtime is distroless/base-nossl plus libgcc_s (see the Dockerfile —
      # `scratch` could not execute those binaries at all), so glibc/libgcc CVEs
      # are reportable again and this gate may start failing on them. That is the
      # trade being made deliberately: the exploitable surface here is ffmpeg
      # parsing third-party bytes, which is identical on either base — only the
      # report changes. See docs/ffmpeg-runtime-regression.md §4.
      #
      # It stays blocking, and with no ignore-unfixed. The first time that hurt
      # was CVE-2026-14456 in libssl3, HIGH and unfixed, which halted every
      # deployment over OpenSSL's QUIC server — code this image does not run.
      # The answer was to stop shipping OpenSSL, not to stop reporting it: a gate
      # that is taught to look away has to be taught again for the next one.
      - name: Scan pushed image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Not env.IMAGE_NAME (github.repository, e.g. "sos-pc/SpotiFLAC-SH") —
          # OCI image references must be all-lowercase and that isn't, which
          # made Trivy reject it outright ("could not parse reference").
          # docker/metadata-action already lowercased it correctly for the tag
          # actually pushed; reuse that instead of re-deriving it here.
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
