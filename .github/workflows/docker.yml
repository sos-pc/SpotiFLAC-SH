name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - kiro
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend (required for go:embed)
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Runs right after the frontend build with nothing in between — go
      # test needs the go:embed'd frontend/dist directory (untracked,
      # gitignored) to still be on disk, and at least one of the linting
      # actions below was observed wiping it out (fine for go vet/
      # golangci-lint/govulncheck, which don't need to actually embed file
      # contents to type-check, but not for a real go test build).
      - name: Run Go tests
        run: go test ./... -v

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

      - name: Frontend lint (non-blocking — pre-existing findings not yet triaged)
        working-directory: frontend
        continue-on-error: true
        run: bun run lint

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned to a commit SHA, not a tag: in March 2026 aquasecurity/trivy-action
      # was compromised via a stolen credential that force-pushed 75 of its 76
      # version tags (including floating majors like v0.28) to malicious commits
      # that stole CI secrets. This SHA (tag v0.35.0's target before the attack,
      # confirmed unaffected — https://github.com/aquasecurity/trivy-action/releases/tag/v0.35.0)
      # can't be silently moved to point somewhere else the way a tag can.
      #
      # Non-blocking for now: the first real scan found 6 CRITICAL/6 HIGH CVEs,
      # almost all in ffmpeg and its codec libraries (libaom, libavcodec, ...)
      # as packaged by debian:bookworm-slim — several already marked
      # will_not_fix/fix_deferred by Debian itself. That needs a deliberate
      # base-image/ffmpeg-source decision, not a reflexive fix, so this reports
      # every build without blocking the push until that's triaged.
      - name: Scan pushed image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        continue-on-error: true
        with:
          # Not env.IMAGE_NAME (github.repository, e.g. "sos-pc/SpotiFLAC-SH") —
          # OCI image references must be all-lowercase and that isn't, which
          # made Trivy reject it outright ("could not parse reference").
          # docker/metadata-action already lowercased it correctly for the tag
          # actually pushed; reuse that instead of re-deriving it here.
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
