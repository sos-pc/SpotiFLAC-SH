name: Tests

# The verdict workflow: runs go-checks.yml on main and on every pull request,
# and publishes nothing. `checks / test` from here is the check branch
# protection requires, so this is the gate every change passes through.
#
# It exists separately from docker.yml because that one's job is to publish an
# image, and the two answer different questions — "is this correct?" versus
# "here is something you can deploy". Before it, `main` had no CI at all: the
# v4.0.0 provider removal, the package split, and sixteen untouched dependabot
# branches all sat there compiled on nobody's machine but the author's — a
# Windows one, where two path tests fail for platform reasons and are easy to
# start reading as background noise.
#
# docker.yml also runs go-checks.yml before it publishes, so a release is never
# built from an untested tree. That duplicate run on pull requests is the price
# of the two staying independent, and it is worth paying: folding them together
# would tie "is this correct" to "should this be published".

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
# Pull requests especially: force-pushes during review would otherwise queue a
# run per revision. `main` is the exception — each commit there is a distinct
# state someone may need the verdict for.
#
# That exception is expressed in the GROUP, not in cancel-in-progress. The
# obvious form, `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}`,
# was here first and did not work: merging seven dependabot PRs cancelled the
# runs for three intermediate commits on main, and their verdicts are gone.
# Giving each main commit its own group makes the cancellation structurally
# impossible rather than conditional — there is never a second run in the group
# to cancel — while pull requests keep collapsing to their latest revision.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/go-checks.yml
