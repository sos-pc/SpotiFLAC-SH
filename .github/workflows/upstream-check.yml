name: Check Upstream Changes

# Watches spotbye/SpotiFLAC — the origin of our Go code. It is a PORT SOURCE, not
# a dependency: we read it for ideas, we never merge it. (The engine, which IS a
# dependency, is handled by engine-image.yml — different problem, different shape.)
#
# All the logic lives in ./check-upstream.sh so there is one implementation and
# it can be run locally, which is where triage actually happens. This file used
# to reimplement it inline; the two had already drifted apart.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/spotbye/SpotiFLAC.git

      - name: Compare against the reviewed baseline
        id: check
        run: ./check-upstream.sh --github

      # Nothing we watch moved, but upstream did. There is no decision to make,
      # so the marker advances on its own — this is what stops a backlog forming
      # (35 commits sat un-triaged for ten days before this existed).
      - name: Advance baseline (nothing watched changed)
        if: steps.check.outputs.can_auto_advance == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.check.outputs.upstream_head }}" > .github/upstream-last-reviewed.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-last-reviewed.txt
          git commit -m "chore(upstream): mark ${{ steps.check.outputs.upstream_short }} as reviewed (nothing watched changed)"
          git push

      # One issue, updated in place. A new one per run would be noise, and the
      # question it asks is always the same one.
      - name: Upsert tracking issue
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_HEAD: ${{ steps.check.outputs.upstream_head }}
          UPSTREAM_SHORT: ${{ steps.check.outputs.upstream_short }}
          COMMIT_COUNT: ${{ steps.check.outputs.commit_count }}
          WATCHED_COUNT: ${{ steps.check.outputs.watched_count }}
          IGNORED_COUNT: ${{ steps.check.outputs.ignored_count }}
          WATCHED_FILES: ${{ steps.check.outputs.watched_files }}
        run: |
          set -euo pipefail
          BASELINE_SHORT=$(cut -c1-8 .github/upstream-last-reviewed.txt)

          cat > /tmp/issue.md <<EOF
          ## 🔄 Upstream — [spotbye/SpotiFLAC](https://github.com/spotbye/SpotiFLAC)

          Updated in place; this issue always reflects the current state.

          **HEAD** \`${UPSTREAM_SHORT}\` · **baseline** \`${BASELINE_SHORT}\` · **${COMMIT_COUNT}** commit(s)

          ${WATCHED_COUNT} watched file(s) changed · ${IGNORED_COUNT} ignored by
          [\`upstream-ignore.txt\`](../blob/main/.github/upstream-ignore.txt)

          ---

          ### Worth a look

          ${WATCHED_FILES}

          ---

          ### Triaging

          \`\`\`bash
          ./check-upstream.sh --verbose    # the diffs, locally
          echo ${UPSTREAM_HEAD} > .github/upstream-last-reviewed.txt
          git commit -am "chore(upstream): reviewed ${UPSTREAM_SHORT}"
          \`\`\`

          Decided we do not want one of these at all? Add it to
          \`.github/upstream-ignore.txt\` with a reason — that is how it stops
          coming back, and the reason is the record of the decision.

          ---
          *[upstream-check.yml](../blob/main/.github/workflows/upstream-check.yml)*
          EOF

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-sync \
                       --state open --json number --jq '.[0].number // empty')
          TITLE="[Upstream] spotbye/SpotiFLAC @ ${UPSTREAM_SHORT}"

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue.md
            echo "updated issue #${EXISTING}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file /tmp/issue.md --label upstream-sync
          fi

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            echo "⚠️ ${{ steps.check.outputs.watched_count }} watched file(s) changed — issue updated." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outputs.can_auto_advance }}" = "true" ]; then
            echo "✅ ${{ steps.check.outputs.commit_count }} commit(s), none touching anything we watch — baseline advanced." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Already at the reviewed baseline." >> "$GITHUB_STEP_SUMMARY"
          fi
