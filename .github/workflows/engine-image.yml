name: Engine image

# Builds ghcr.io/sos-pc/spotiflac-engine — upstream's published package plus our
# shim and patches. See docs/upstream-tracking-plan.md §2.
#
# Reacting to an upstream release means polling: GitHub cannot fire a workflow
# here from an event in someone else's repository. So the cheap job below asks
# PyPI what the current version is and compares it to the label our own last
# published image already carries — the artifact is the state, no separate file
# to keep in sync. The expensive job runs only when they disagree.

on:
  schedule:
    # Every 30 minutes. Cron can slip under load, which is fine at this interval:
    # PyPI publishes ~19s after upstream tags, so the image trails a release by
    # well under an hour either way.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the published image is already current"
        type: boolean
        default: false
  push:
    # main included on purpose: the scheduled check only compares upstream's
    # PyPI version against the published label, so it cannot notice that OUR
    # shim, patches or Dockerfile changed. Without this, an engine/ change
    # merged to main would sit unbuilt until upstream happened to release.
    branches: [main, "feature/**"]
    paths:
      - "engine/**"
      - ".github/workflows/engine-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/spotiflac-engine

jobs:
  check:
    name: Is a rebuild needed?
    runs-on: ubuntu-latest
    # Three small HTTP calls; a successful run finishes in well under a minute.
    # The bound is deliberate rather than incidental: this job reaches out to
    # PyPI and to the registry, and neither had a deadline of any kind until the
    # timeouts below were added. Five minutes is roughly ten times the observed
    # runtime, so it can only fire on a genuine stall.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      - name: Latest version on PyPI
        id: upstream
        run: |
          set -euo pipefail
          v=$(curl -fsSL --connect-timeout 10 --max-time 30 https://pypi.org/pypi/SpotiFLAC/json | jq -er .info.version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "PyPI: $v"

      - name: Version inside our published image
        id: published
        run: |
          set -uo pipefail
          # Read the label straight off the registry: anonymous, no pull, three
          # small requests. "none" covers the first run (no :latest yet) and any
          # failure — never guess a version, just rebuild.
          #
          # NOT `docker buildx imagetools inspect --format '{{json .Config.Labels}}'`:
          # :latest is a multi-platform OCI index and .Config is empty on an
          # index, so that returned "none" every run and rebuilt the image every
          # 30 minutes for half a day before anyone looked. Walk
          # index -> platform manifest -> config blob, which is what that command
          # does internally anyway.
          IMG="${IMAGE_NAME}"
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          v=none
          if TOKEN=$(curl -fsS --connect-timeout 10 --max-time 30 "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMG}:pull" | jq -er .token); then
            if M=$(curl -fsSL --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" "https://ghcr.io/v2/${IMG}/manifests/latest"); then
              D=$(echo "$M" | jq -r 'if .manifests then (.manifests[]|select(.platform.architecture=="amd64")|.digest) else empty end' | head -1)
              if [ -n "$D" ]; then
                M=$(curl -fsSL --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" "https://ghcr.io/v2/${IMG}/manifests/${D}") || M=""
              fi
              C=$(echo "$M" | jq -r '.config.digest // empty')
              if [ -n "$C" ]; then
                v=$(curl -fsSL --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${IMG}/blobs/${C}" | jq -r '.config.Labels["org.opencontainers.image.version"] // "none"') || v=none
              fi
            fi
          fi
          [ -n "$v" ] || v=none
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "published: $v"

      - name: Compare
        id: compare
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "rebuilding: forced or engine/ changed"
          elif [ "${{ steps.upstream.outputs.version }}" != "${{ steps.published.outputs.version }}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "rebuilding: ${{ steps.published.outputs.version }} -> ${{ steps.upstream.outputs.version }}"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "up to date at ${{ steps.upstream.outputs.version }}, nothing to do"
          fi

  build:
    name: Build and publish
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # :latest only moves on the default branch. A build from a feature branch
      # publishes its own tag so it can be tested without displacing what the
      # deployment pulls.
      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          V="${{ needs.check.outputs.version }}"
          IMG="${REGISTRY}/${IMAGE_NAME}"
          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "tags=${IMG}:${V},${IMG}:latest" >> "$GITHUB_OUTPUT"
          else
            SAFE=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
            echo "tags=${IMG}:${V}-${SAFE},${IMG}:${SAFE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./engine
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SPOTIFLAC_VERSION=${{ needs.check.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          # The version label is what the check job reads next time round, so it
          # has to be the version actually installed — hence passing it in rather
          # than letting the build resolve its own.
          labels: |
            org.opencontainers.image.title=SpotiFLAC engine
            org.opencontainers.image.description=Download engine sidecar (upstream SpotiFLAC + our shim)
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Engine image published"
            echo ""
            echo "- SpotiFLAC \`${{ needs.check.outputs.version }}\`"
            echo "- tags: \`${{ steps.tags.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # This workflow runs unattended every 30 minutes and publishes `:latest`, so a
  # red run is the only signal that the deployment has stopped tracking upstream.
  # It was not a signal at all: two failures sat unnoticed for hours today
  # because nobody refreshes an Actions tab on a schedule. Automation that has to
  # be watched is not automation.
  #
  # One issue, opened on failure and closed on the next success — the same shape
  # upstream-check.yml uses. It cannot pile up, and it cannot go stale: if the
  # next scheduled run succeeds, it closes itself.
  report:
    name: Report status
    needs: [check, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERSION: ${{ needs.check.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL=engine-build

          # Idempotent: the label may not exist on a fresh repository, and
          # `gh issue create --label` fails outright if it does not.
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" \
            --description "Engine image build is failing" --color B60205 2>/dev/null || true

          # The most recently updated open issue with the label is canonical;
          # anything else is a duplicate to be closed. Not `.[0]`: the API does
          # not guarantee an order, so it can name a different issue between runs
          # and quietly abandons the rest. upstream-check.yml used that form and
          # grew exactly that bug — two labelled issues, one updated forever and
          # one left announcing a state three weeks out of date. This job was
          # written by copying that pattern, so it inherited the flaw before it
          # had ever run.
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
                   --state open --json number,updatedAt \
                   --jq 'sort_by(.updatedAt) | reverse | .[].number')
          EXISTING=$(echo "$OPEN" | head -1)

          if [ "$CHECK_RESULT" != "failure" ] && [ "$BUILD_RESULT" != "failure" ]; then
            if [ -n "$EXISTING" ]; then
              # All of them: recovery means none of these describe reality any more.
              for n in $OPEN; do
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                  --comment "Recovered: the engine image built successfully at [this run]($RUN_URL)."
                echo "closed #${n} - build recovered"
              done
            else
              echo "nothing to report"
            fi
            exit 0
          fi

          if [ "$CHECK_RESULT" = "failure" ]; then
            STAGE="the staleness check (PyPI / registry read)"
          else
            STAGE="the image build"
          fi

          cat > /tmp/issue.md <<EOF
          ## 🚨 Engine image is not building

          The sidecar deployment tracks \`:latest\`, so while this is broken the
          server stays on the last image that built — it does not follow upstream.

          **Failed in:** ${STAGE}
          **Upstream version being built:** \`${VERSION:-unknown}\`
          **Run:** ${RUN_URL}

          ---

          ### Where to look first

          The build is deliberately strict, and each guard names a different cause:

          - **\`patch\` failed** — upstream changed code one of
            [\`engine/patches/\`](../blob/main/engine/patches) rewrites. Rebase the
            patch, or drop it if upstream fixed the bug themselves.
          - **\`contract check\` failed** — upstream renamed something
            [\`shim.py\`](../blob/main/engine/shim.py) calls. Fix the call and
            [\`contract-check.py\`](../blob/main/engine/contract-check.py) together.
          - **\`import check\` failed** — the wheel does not declare a dependency
            it needs. Add it to the image.
          - **the check job failed** — a network read of PyPI or ghcr, not our
            code. It usually clears by itself; this issue closes on the next
            green run.

          ---
          *[engine-image.yml](../blob/main/.github/workflows/engine-image.yml) — updated in place, closes itself on recovery*
          EOF

          TITLE="[Engine] image build failing (SpotiFLAC ${VERSION:-unknown})"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue.md
            echo "updated #${EXISTING}"
            for n in $(echo "$OPEN" | tail -n +2); do
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
                --comment "Duplicate of #${EXISTING}, the issue this workflow keeps current."
              echo "closed duplicate #${n}"
            done
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file /tmp/issue.md --label "$LABEL"
          fi
